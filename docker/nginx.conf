map "$status:$uri" $adbot_cache_control {
    default "no-store";
    ~^200:/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;
    access_log off;
    add_header Cache-Control $adbot_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    location ~ (^|/)\. { return 404; }
    location ~* \.(map|env|ini|db|sqlite|py|log|bak)$ { return 404; }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 70s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
