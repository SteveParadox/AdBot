# Optional additions inside an origin TLS server block. Not activated automatically.
# Obtain the CURRENT Cloudflare ranges from https://www.cloudflare.com/ips/.
# Add one `set_real_ip_from CIDR;` per verified IPv4 AND IPv6 range, never 0.0.0.0/0.
# real_ip_header CF-Connecting-IP;
# real_ip_recursive off;
# ssl_certificate /run/secrets/origin.crt;
# ssl_certificate_key /run/secrets/origin.key;
# ssl_client_certificate /run/secrets/cloudflare-origin-pull-ca.pem;
# ssl_verify_client on;
# Use a hostname-specific client certificate where supported; the shared Cloudflare certificate
# identifies the Cloudflare network, not uniquely your account. Also restrict the Host header.
# For an authenticated tunnel-only origin, configure a separate listener bound to the connector
# network and set X-Forwarded-Proto to the fixed value https after verifying edge HTTPS enforcement.
# Pass X-Real-IP only after validating the connector network and CF-Connecting-IP in that listener.
