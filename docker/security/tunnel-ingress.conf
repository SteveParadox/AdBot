# CF-Visitor is trusted only after the connector socket-peer check below.
map $http_cf_visitor $adbot_tunnel_https {
    default 0;
    ~\x22scheme\x22[[:space:]]*:[[:space:]]*\x22https\x22 1;
}

# Only the authenticated cloudflared connector may use this listener.
# Keep this peer and the Compose subnet/static connector address in sync.
geo $realip_remote_addr $adbot_tunnel_peer {
    default 0;
    172.30.50.2/32 1;
}

server {
    listen 8081;
    set_real_ip_from 172.30.50.2/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    if ($adbot_tunnel_peer = 0) { return 403; }
    if ($adbot_tunnel_https = 0) { return 426; }
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;
    access_log off;
    add_header Cache-Control $adbot_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    location ~ (^|/)\. { return 404; }
    location ~* \.(map|env|ini|db|sqlite|py|log|bak)$ { return 404; }
    location /api/ {
        proxy_pass http://tunnel-api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 70s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto https;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
